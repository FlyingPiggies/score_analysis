version: "3.9"

services:
  score-api:
    image: score-analysis-api:latest
    container_name: score-analysis-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./runtime_tasks:/app/runtime_tasks
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5
